steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'gcr.io/$PROJECT_ID/wisemonitor-api',
        '.'
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/wisemonitor-api']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'wisemonitor-api',
        '--image',
        'gcr.io/$PROJECT_ID/wisemonitor-api',
        '--region',
        'europe-west1',
        '--platform',
        'managed',
        '--allow-unauthenticated',
        # Um WebSocket conta como uma requisição no Cloud Run. Com o padrão de 300s,
        # /ws/monitor (painel) e /ws/agent-stream (tela ao vivo) seriam derrubados a
        # cada 5 minutos e precisariam reconectar.
        '--timeout',
        '3600'
      ]
